version: "3.9"

services:
  # ─── 后端 API ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bl-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_DRIVER=sqlite
      - SQLITE_PATH=/app/data/book_library.db
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - bl_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── 前端（Next.js standalone） ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=/api
    container_name: bl-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE=/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  bl_data:
